services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: year5_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent SQLite database storage
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
